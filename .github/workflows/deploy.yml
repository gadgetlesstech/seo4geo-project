name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/,client/src/,client/components/,client/lib/,client/public/,client/index.html,client/vite.config.js,client/package.json,client/package-lock.json,client/tsconfig.json,package.json,package-lock.json,Dockerfile,docker-compose.yml,.dockerignore,drip-campaign/"
          target: /var/www/seo4geo
          timeout: 120s
          command_timeout: 20m

      - name: Write .env and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cat > /var/www/seo4geo/.env << ENVEOF
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            APP_URL=https://seo4geo.com
            DATAFORSEO_LOGIN=${{ secrets.DATAFORSEO_LOGIN }}
            DATAFORSEO_PASSWORD=${{ secrets.DATAFORSEO_PASSWORD }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}
            ENVEOF
            cd /var/www/seo4geo
            docker compose build --no-cache
            docker compose up -d
            echo "--- Importing n8n workflow via CLI ---"
            docker cp /var/www/seo4geo/drip-campaign/seo4geo-drip-workflow.json root-n8n-1:/tmp/seo4geo-drip.json
            docker exec root-n8n-1 n8n import:workflow --input=/tmp/seo4geo-drip.json --overwrite
            echo "n8n import done"
